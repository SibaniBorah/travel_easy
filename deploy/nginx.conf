# Chalo NorthEast — Nginx Reverse Proxy & Static Cache Configuration

upstream chaloner_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name chalonortheast.in www.chalonortheast.in;

    # Gzip compression for low-bandwidth 3G mobile networks
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Static assets cache
    location /static/ {
        alias /home/sibaniborah/gu/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # API endpoints — pass through with real client IPs
    location /api/ {
        proxy_pass http://chaloner_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA frontend fallback
    location / {
        proxy_pass http://chaloner_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
